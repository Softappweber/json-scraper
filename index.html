<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔍 Business Scraper Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="header">
<h1>🔍 Business Scraper Pro</h1>
<p>SerpAPI + Hunter API + Google Sheets</p>
</div>

<div class="panel config-panel">
<h3>⚙️ API Configuration</h3>
<div class="grid">
<div class="field">
<label>Google Apps Script URL</label>
<input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/...">
</div>
<div class="field">
<label>SerpAPI Key</label>
<input type="text" id="serpApiKey" placeholder="SerpAPI key (serpapi.com)">
</div>
<div class="field">
<label>Hunter API Key</label>
<input type="text" id="hunterApiKey" placeholder="Hunter API key (hunter.io)">
</div>
</div>
</div>

<div class="panel">
<h3>🔍 Search</h3>
<div class="grid">
<div class="field">
<label>City</label>
<input type="text" id="city" placeholder="Mumbai">
</div>
<div class="field">
<label>Business Type</label>
<input type="text" id="category" placeholder="Photographer">
</div>
<div class="field">
<label>Max Results</label>
<input type="number" id="limit" value="50" min="10" max="100">
</div>
</div>
<div class="actions">
<button class="btn primary" id="scrapeBtn" onclick="startScrape()">🔍 Start Scraping</button>
<button class="btn success" id="saveBtn" onclick="saveData()" disabled>💾 Save to Sheet</button>
<button class="btn secondary" onclick="loadData()">📊 Load from Sheet</button>
</div>
</div>

<div class="panel">
<div class="stats">
<div class="stat"><div class="num" id="statContacts">0</div><div class="label">Contacts</div></div>
<div class="stat"><div class="num" id="statEmails">0</div><div class="label">Emails</div></div>
<div class="stat"><div class="num" id="statPhones">0</div><div class="label">Phones</div></div>
<div class="stat"><div class="num" id="statVerified">0</div><div class="label">Verified</div></div>
</div>
</div>

<div class="panel">
<h3>📊 Results</h3>
<div class="table-wrap">
<table>
<thead><tr><th>#</th><th>Business</th><th>Email</th><th>Status</th><th>Phone</th><th>Website</th><th>Source</th></tr></thead>
<tbody id="results"><tr><td colspan="7" class="empty">Search karne ke baad results yahan dikhenge</td></tr></tbody>
</table>
</div>
</div>

<div class="panel">
<h3>📋 Log</h3>
<div class="log" id="log">Ready. API keys daalo aur scrape karo.</div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
